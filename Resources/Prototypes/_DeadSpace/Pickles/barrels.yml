- type: entity
  parent: StorageTank
  id: PickleBarrelBase
  abstract: true
  name: fermentation barrel
  description: A sealed barrel for curing, pickling, and short-round fruit ferments. Needs a warm room.
  components:
  - type: InteractionOutline
  - type: FermentationBarrel
  # Table-like collision: blocks walking, does not eat item clicks (no InteractImpassable).
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.4"
        density: 55
        mask:
        - TableMask
        layer:
        - TableLayer
  - type: Climbable
  - type: PlaceableSurface
  - type: RefillableSolution
    solution: tank
  - type: DrainableSolution
    solution: tank
  - type: ExaminableSolution
    solution: tank
  - type: SolutionContainerManager
    solutions:
      tank:
        maxVol: 200
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.FermentationVisuals.State:
        enum.FermentationVisuals.Layer:
          Idle: { state: idle }
          Fermenting: { state: fermenting }
          Ready: { state: idle }
          Failed: { state: idle }
  - type: ContainerContainer
    containers:
      pickle_produce: !type:Container
        showEnts: False
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Wood
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 80
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 30
      behaviors:
      - !type:SpillBehavior
        solution: tank
      - !type:EmptyAllContainersBehaviour
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Construction
    graph: PickleBarrelWood
    node: barrel

- type: entity
  parent: PickleBarrelBase
  id: PickleBarrelWood
  name: wooden curing barrel
  description: Hammered together from a few planks. Good enough for station curing.
  components:
  - type: Sprite
    sprite: _DeadSpace/Pickles/barrel_wood.rsi
    noRot: true
    layers:
    - state: idle
      map: [ "enum.FermentationVisuals.Layer" ]
  - type: PhysicalComposition
    materialComposition:
      Wood: 300
  - type: Construction
    graph: PickleBarrelWood
    node: barrel

- type: entity
  parent: BaseStructureDynamic
  id: PickleBarrelPlasticFrame
  name: plastic pickle barrel frame
  description: One bucket down. Add another and weld them shut.
  components:
  - type: Sprite
    sprite: _DeadSpace/Pickles/barrel_plastic.rsi
    state: idle
  - type: Construction
    graph: PickleBarrelPlastic
    node: frame
  - type: InteractionOutline
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: FlimsyMetallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  parent: PickleBarrelBase
  id: PickleBarrelPlastic
  name: plastic curing barrel
  description: Two buckets and a welder's worth of culinary science.
  components:
  - type: Sprite
    sprite: _DeadSpace/Pickles/barrel_plastic.rsi
    noRot: true
    layers:
    - state: idle
      map: [ "enum.FermentationVisuals.Layer" ]
  - type: PhysicalComposition
    materialComposition:
      Plastic: 200
  - type: Damageable
    damageModifierSet: FlimsyMetallic
  - type: Construction
    graph: PickleBarrelPlastic
    node: barrel
