  - type: SurveyArtifact
    tier: 1
    points: 3000
    boons:
    - boon: Purity
      value: 0.3
    - boon: Swift
      value: -0.05
  - type: StaticPrice
    price: 2500

- type: entity
  parent: SurveyArtifactBase
  id: SurveyArtifactStoneFlower
  name: каменный цветок
  description: Лепестки из камня, тяжёлые, как гиря. Кожа под ним грубеет.
  components:
  - type: Sprite
