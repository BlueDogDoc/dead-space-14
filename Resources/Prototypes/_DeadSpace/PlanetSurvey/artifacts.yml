- type: entity
  parent: SurveyArtifactBase
  id: SurveyArtifactThunder
  name: громовой осколок
  description: Жёлтый зигзаг, застывший в стекле. Само по себе ничего не даёт, но НИО вплавит его в спусковой механизм.
