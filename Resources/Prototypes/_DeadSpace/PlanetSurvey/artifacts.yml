- type: entity
  abstract: true
  parent: BaseItem
  id: SurveyToolBase
  components:
  - type: Sprite
    sprite: _DeadSpace/PlanetSurvey/tools.rsi
  - type: Item
    sprite: _DeadSpace/PlanetSurvey/tools.rsi
    size: Small

- type: entity
  parent: SurveyToolBase
  id: SurveyAnomalyDetector
  name: детектор аномалий
  description: Пищит чаще, когда рядом аномалия, и подсвечивает ту, что совсем близко. Ловит сигнал артефактов. Держать в руке.
  components:
  - type: Sprite
    sprite: _DeadSpace/PlanetSurvey/detector.rsi
    layers:
    - state: icon
    - state: screen
      shader: unshaded
  - type: Item
    sprite: _DeadSpace/PlanetSurvey/detector.rsi
  - type: SurveyDetector
  - type: StaticPrice
    price: 300

- type: entity
  parent: SurveyToolBase
  id: SurveyArtifactAnalyzer
  name: анализатор артефактов
  description: Учёный прибор. Показывает свойства артефакта и отправляет данные в РНД. Без допуска НИО не включается.
  components:
  - type: Sprite
    sprite: _DeadSpace/PlanetSurvey/analyzer.rsi
    state: icon
  - type: Item
    sprite: _DeadSpace/PlanetSurvey/analyzer.rsi
  - type: SurveyAnalyzer
  - type: StaticPrice
    price: 300

- type: entity
  parent: SurveyToolBase
  id: SurveyArtifactStabilizer
  name: стабилизатор артефактов
  description: Расщепляет изученный артефакт на безопасные вставки для брони, одежды или оружия. Живую ткань превращает в полевую пену. Без допуска НИО не включается.
  components:
  - type: Sprite
    sprite: _DeadSpace/PlanetSurvey/stabilizer.rsi
    state: icon
  - type: Item
    sprite: _DeadSpace/PlanetSurvey/stabilizer.rsi
  - type: SurveyStabilizer
    products:
      Mending: SurveyLimbFoam
  - type: StaticPrice
    price: 500

- type: entity
  parent: SurveyToolBase
  id: SurveyInfusionPlate
  name: аномальная вставка
  description: Тонкая пластина со стабилизированным осколком артефакта. Вшивается в одежду, броню или оружие.
  components:
  - type: Sprite
    state: plate
  - type: Item
    heldPrefix: plate
    size: Tiny
  - type: SurveyPlate
  - type: StaticPrice
    price: 800

- type: entity
  parent: BaseLimbRestorer
  id: SurveyLimbFoam
  name: регенерирующая пена
  description: Баллон с пеной из живой ткани. Пришивает оторванные руки и ноги, сращивает кости и останавливает кровь прямо в бою.
  components:
  - type: Sprite
    sprite: _DeadSpace/PlanetSurvey/tools.rsi
    state: foam
  - type: Item
    sprite: _DeadSpace/PlanetSurvey/tools.rsi
    heldPrefix: foam
  - type: LimbRestorer
    charges: 1
    maxCharges: 1
    prime: 1
    primeWindow: 60
    delay: 4
    selfDelay: 6
    health: 0.5
    regrow: 0.4
    heal:
    - Bleed
    - Fracture
    - Shard
    - Flesh
    - Skin
    - Limbs
  - type: StaticPrice
    price: 1500

- type: entity
  parent: BaseStorageItem
  id: SurveyLeadCase
  name: свинцовый кейс
  description: Тяжёлый кейс для артефактов. Внутри они не фонят и не действуют.
  components:
  - type: Sprite
    sprite: _DeadSpace/PlanetSurvey/tools.rsi
    layers:
    - state: leadcase
      map: [ base ]
  - type: Item
    sprite: _DeadSpace/PlanetSurvey/tools.rsi
    heldPrefix: leadcase
    size: Large
  - type: Storage
    maxItemSize: Small
    grid:
    - 0,0,3,1
    whitelist:
      components:
      - SurveyArtifact
    storageOpenSound: /Audio/Items/toolbox_open.ogg
    storageCloseSound: /Audio/Items/toolbox_close.ogg
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.StorageVisuals.Open:
        base:
          True: { state: leadcase-open }
          False: { state: leadcase }
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Items/toolbox_drop.ogg
  - type: SurveyLeadCase
  - type: StaticPrice
    price: 400

- type: entity
  parent: SurveyToolBase
  id: SurveyBeacon
  name: маяк разведки
  description: Складная тренога с передатчиком. Поставьте в неразмеченном секторе планеты и продержитесь, пока она передаёт карту. Туземцы услышат.
  components:
  - type: Sprite
    state: beacon
  - type: Item
    heldPrefix: beacon
    size: Normal
  - type: SurveyBeacon
  - type: StaticPrice
    price: 150

- type: entity
  parent: BaseStructure
  id: SurveyBeaconDeployed
  name: работающий маяк разведки
  description: Передаёт карту сектора на станцию. Если его сломают раньше, сектор останется белым пятном.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Clickable
  - type: InteractionOutline
  - type: Sprite
    sprite: _DeadSpace/PlanetSurvey/tools.rsi
    state: beacon-deployed
    drawdepth: Objects
  - type: PointLight
    radius: 2.5
    energy: 1.5
    color: "#df8e5a"
    castShadows: false
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.3,-0.3,0.3,0.3"
        density: 50
        mask:
        - MachineMask
        layer:
        - MidImpassable
        - LowImpassable
        - BulletImpassable
  - type: Damageable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 60
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: SurveyBeaconDeployed

- type: latheRecipePack
  id: SurveyScienceStatic
  recipes:
  - SurveyArtifactAnalyzer
  - SurveyArtifactStabilizer

- type: latheRecipe
  id: SurveyArtifactAnalyzer
  result: SurveyArtifactAnalyzer
  completetime: 4
  materials:
    Steel: 200
    Glass: 300
    Silver: 100

- type: latheRecipe
  id: SurveyArtifactStabilizer
  result: SurveyArtifactStabilizer
  completetime: 6
  materials:
    Steel: 300
    Plasma: 200
    Gold: 100

- type: cargoProduct
  id: SurveyAnomalyDetector
  icon:
    sprite: _DeadSpace/PlanetSurvey/detector.rsi
    state: icon
  product: SurveyAnomalyDetector
  cost: 600
  category: cargoproduct-category-name-cargo
  group: market

- type: cargoProduct
  id: SurveyLeadCase
  icon:
    sprite: _DeadSpace/PlanetSurvey/tools.rsi
    state: leadcase
  product: SurveyLeadCase
  cost: 800
  category: cargoproduct-category-name-cargo
  group: market

- type: cargoProduct
  id: SurveyBeacon
  icon:
    sprite: _DeadSpace/PlanetSurvey/tools.rsi
    state: beacon
  product: SurveyBeacon
  cost: 400
  category: cargoproduct-category-name-cargo
  group: market
