- type: entity
  parent: SurveyPrototypeBase
  id: SurveyPrototypeMesh
  name: нанопряжа
  description: Катушка серой нити, которая сама вплетается в ткань. Руки и ноги с ней не отлетают.
  components:
  - type: Sprite
    state: mesh
