- type: entity
  parent: SurveyArtifactBase
  id: SurveyArtifactCrystal
  name: кристальная колючка
  description: Острые иглы растут друг из друга. Жар и ток уходят в них, как в землю.
  components:
  - type: Sprite
    state: crystal
  - type: Item
    heldPrefix: crystal
